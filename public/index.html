<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Where is this?</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta name="description" content="Street View drops you somewhere. Pin where you think it is.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://maps.googleapis.com">
  <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
  <link rel="preconnect" href="https://streetviewpixels-pa.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap">
  <!-- MapLibre for the guess map: pinned version, integrity-checked. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.1/dist/maplibre-gl.css"
        integrity="sha384-uTttxo/aOKbdE5RlD/SPzSDoDmNvGlUYPjONi2MN/b7c9HPSvW07OIuyP7uL6jxK" crossorigin="anonymous">
  <link rel="stylesheet" href="/style.css">
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.1/dist/maplibre-gl.js"
          integrity="sha384-nXMl9YiLoSG5KBPTFgvxVuIqQQcqIvo0bFrvoEaGJC6r7IibIzF1S36Zbf/sKBtL" crossorigin="anonymous" defer></script>
</head>
<body data-view="loading" data-movement="move">
  <div id="pano-frame"><div id="pano" aria-label="Street View"></div></div>
  <div id="lock"></div>

  <a class="home" href="https://margauxfaurie.com">margauxfaurie.com</a>

  <div id="hud">
    <span class="pill" id="hud-round"></span>
    <span class="pill" id="hud-score"></span>
    <span class="pill" id="hud-timer" hidden></span>
  </div>

  <div id="tools">
    <div id="compass" class="compass" role="img" aria-label="Compass"><span id="compass-needle" class="needle"></span><b>N</b></div>
    <button type="button" class="pill tool" id="back-to-start" hidden>Back to start</button>
  </div>

  <div id="guess">
    <div id="guess-map"></div>
    <button type="button" class="btn" id="guess-btn" disabled>Place your pin</button>
    <p class="hint">Space to guess</p>
  </div>

  <section id="result" aria-live="polite">
    <p class="small" id="result-round"></p>
    <h2 class="project" id="result-title"></h2>
    <p class="lead" id="result-score"></p>
    <div class="meter" aria-hidden="true"><i id="result-meter"></i></div>
    <div class="row">
      <span class="pill" id="result-total"></span>
      <button type="button" class="btn" id="next">Next round</button>
    </div>
  </section>

  <section id="setup" class="screen setup">
    <!-- Behind the form, the page plays a round by itself: a pin drops, the answer appears, the miss is measured. -->
    <div id="landing-map" class="landing-map" aria-hidden="true"></div>
    <p id="demo-card" class="demo-card" aria-hidden="true" hidden>
      <span id="demo-place"></span>
      <strong id="demo-dist"></strong>
      <span id="demo-pts"></span>
    </p>

    <div class="panel setup-panel">
      <h1 class="display title">Where is this<span class="qmark" aria-hidden="true"><span class="qhook">?</span><i class="qpin"></i></span><span class="visually-hidden">?</span></h1>
      <p class="lead">Street View drops you somewhere in the world. Look around, pin where you think you are. Five rounds; the closer, the more points.</p>

      <form id="setup-form">
        <fieldset class="choice" id="movement-field">
          <legend>How you play</legend>
          <label class="option">
            <input type="radio" name="movement" value="move" checked>
            <span class="glyph glyph-move" aria-hidden="true"></span>
            <span class="option-text"><b>Walk around</b><small>Follow the roads, read the signs</small></span>
          </label>
          <label class="option">
            <input type="radio" name="movement" value="nomove">
            <span class="glyph glyph-look" aria-hidden="true"></span>
            <span class="option-text"><b>Stay put</b><small>Turn and zoom, but no walking</small></span>
          </label>
          <label class="option">
            <input type="radio" name="movement" value="nmpz">
            <span class="glyph glyph-frozen" aria-hidden="true"></span>
            <span class="option-text"><b>Frozen</b><small>One view, nothing moves</small></span>
          </label>
        </fieldset>

        <fieldset class="choice choice-time" id="time-field">
          <legend>Time per round</legend>
          <div class="segments">
            <label><input type="radio" name="time" value="0" checked><span>No limit</span></label>
            <label><input type="radio" name="time" value="30"><span>30 s</span></label>
            <label><input type="radio" name="time" value="60"><span>1 min</span></label>
            <label><input type="radio" name="time" value="120"><span>2 min</span></label>
            <label><input type="radio" name="time" value="180"><span>3 min</span></label>
          </div>
        </fieldset>

        <button type="submit" class="btn ink go">Drop me somewhere</button>
      </form>
    </div>
  </section>

  <section id="summary" class="screen">
    <div class="panel">
      <p class="small">Game over</p>
      <h1 class="display" id="summary-total"></h1>
      <p class="lead" id="summary-max"></p>
      <div id="summary-map" class="summary-map" aria-label="Map of every round"></div>
      <ol class="route" id="summary-rounds"></ol>
      <button type="button" class="btn ink" id="again">Play again</button>
    </div>
  </section>

  <div id="loading" role="status" aria-label="Loading"><span class="dots"><i></i><i></i><i></i></span></div>
  <p id="notice" role="status" hidden></p>

  <script src="/app.js" type="module"></script>
</body>
</html>
